name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install

      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071
        id: release
        with:
          command: manifest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if package exists on npm
        id: check_npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view oc-browserless@${VERSION} >/dev/null 2>&1; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.release.outputs.release_created == 'true' || steps.check_npm.outputs.should_publish == 'true'
        run: bun run build

      - name: Publish to npm
        if: steps.release.outputs.release_created == 'true' || steps.check_npm.outputs.should_publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish
